<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мир</title>
  <link rel="stylesheet" href="css/world.css" />
</head>
<body>
  <canvas id="glitchCanvas" class="glitch-canvas"></canvas>
  <div id="glitchFlash" class="glitch-flash"></div>

<main id="world" class="world">
  <img id="worldBg" class="world-bg" src="img/world-bg.jpg" alt="" />

  <img
    id="collisionMap"
    class="collision-map"
    src="img/collision.png"
    alt=""
  />

  <img id="player" class="player" src="img/player.png" alt="" />

  <div id="zonePrompt" class="zone-prompt">
    Погрузиться в ячейку памяти?
  </div>
</main>

<aside id="terminalHud" class="terminal-hud">
  <video
    id="terminalVideo"
    class="terminal-video"
    src="img/gif.mp4"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  ></video>

  <canvas id="terminalCanvas" class="terminal-canvas"></canvas>

  <pre id="terminalAscii" class="terminal-ascii"></pre>

  <img
    class="terminal-frame"
    src="img/terminal-frame.png"
    alt=""
    draggable="false"
  />
  <div id="terminalZoneText" class="terminal-zone-text"></div>
</aside>
<div id="wasdHint" class="wasd-hint">
  передвигайтесь на WASD
</div>
<audio
  id="worldBalletAudio"
  src="audio/ballet.mp3"
  preload="auto"
  loop
></audio>
<div id="textSwarmOverlay" class="text-swarm-overlay">
  <div id="textSwarmLayer" class="text-swarm-layer"></div>

  <div id="textSwarmExitHint" class="text-swarm-exit-hint">
    ESC — выйти
  </div>
</div>
  <script src="js/world.js"></script>
</body>
</html>
